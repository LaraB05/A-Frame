
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modelo 3D - MindAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Carregar o modelo 3D -->
    <a-assets>
      <a-asset-item
        id="edificio"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Building/glTF-Binary/Building.glb">
      </a-asset-item>
    </a-assets>

    <!-- Câmara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- O modelo aparece quando a imagem-alvo é reconhecida -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity
        gltf-model="#edificio"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3">
      </a-entity>

      <!-- Texto por cima do modelo -->
      <a-text
        value="Edificio 3D"
        position="0 1.5 0"
        align="center"
        color="#ffffff"
        scale="0.5 0.5 0.5">
      </a-text>

    </a-entity>

  </a-scene>
</body>
</html>
